<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经营周报数字员工 · 工单台</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f5f6f8;color:#1c2430;
 font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#6b7684;font-size:13px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:10px;padding:20px;margin-bottom:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;
 background:#eef1f6;color:#5b6675}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=file],textarea{width:100%;padding:8px 10px;
 border:1px solid #d3dae5;border-radius:6px;font-size:14px;background:#fff}
textarea{min-height:70px}
button{margin-top:16px;padding:9px 20px;border:0;border-radius:6px;background:#1a56c4;
 color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.danger{background:#b3261e;margin-left:8px}
button.ghost{background:#fff;border:1px solid #d3dae5;color:#3a4657;margin-left:8px}
button:disabled{opacity:.55;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f6}
th{background:#fafbfd;color:#5b6675;font-weight:600}
.ok{color:#12734a;font-weight:700}.bad{color:#b3261e;font-weight:700}
.msg{padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px}
.msg.err{background:#fdeaea;color:#b3261e}
.msg.ok{background:#e4f6ec;color:#12734a}
.tip{background:#e6effd;color:#1a4fa8}
.charts{display:flex;flex-wrap:wrap;gap:12px}
.charts figure{margin:0;flex:1 1 260px;background:#fafbfd;border:1px solid #eef1f6;
 border-radius:8px;padding:10px}
.charts img{width:100%;display:block}
figcaption{font-size:12px;color:#6b7684;text-align:center;margin-top:6px}
pre{background:#f7f9fc;border:1px solid #e6ecf5;border-radius:6px;padding:10px;
 overflow:auto;font-size:12px}
.muted{color:#6b7684;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1 1 200px}
</style>
</head>
<body>
<div class="wrap">
  <h1>经营周报数字员工 · 工单台</h1>
  <div class="sub">场景 A：结构化表单 → 准入校验 → 执行 → 自动质检 → 人工审核 → 交付</div>

  <div class="card">
    <form id="f">
      <div class="row">
        <div><label>统计周期 *</label><input type="text" name="period" value="2026 年第 44 周" required></div>
        <div><label>发起人 *</label><input type="text" name="submitter" value="张店长" required></div>
      </div>
      <label>任务编号（留空自动生成）</label>
      <input type="text" name="task_id" id="tid">
      <label>门店销售明细（Excel/CSV）</label>
      <input type="file" name="sales_file" id="sf" accept=".xlsx,.xls,.csv">
      <label>周会纪要（docx/txt）</label>
      <input type="file" name="notes_file" id="nf" accept=".docx,.txt">
      <div>
        <button type="submit" id="btn">发起工单</button>
        <button type="button" id="fill" class="ghost">用示例数据填充</button>
      </div>
    </form>
  </div>

  <div id="result"></div>
</div>

<script>
var CID = "conv_web_" + Math.random().toString(16).slice(2, 10);

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function readB64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){
      var d = r.result || "";
      var i = d.indexOf("base64,");
      resolve(i >= 0 ? d.slice(i + 7) : "");
    };
    r.onerror = function(){ reject(r.error); };
    r.readAsDataURL(file);
  });
}

function callApi(payload){
  return fetch("/zhoubao", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json",
               "Makers-Conversation-Id": CID },
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.text().then(function(t){
      try { return JSON.parse(t); } catch(e){ return { ok:false, error:t.slice(0,300) }; }
    });
  });
}

function qaTable(recs){
  var rows = (recs || []).map(function(r){
    var cls = r.passed ? "ok" : "bad";
    var txt = r.passed ? "通过" : "不通过";
    return "<tr><td>" + esc(r.name) + "</td><td class='" + cls + "'>" +
           txt + "</td><td>" + esc(r.detail) + "</td></tr>";
  }).join("");
  if(!rows) rows = "<tr><td colspan='3' class='muted'>尚无质检记录</td></tr>";
  return "<table><thead><tr><th>检查项</th><th>结果</th><th>说明</th></tr></thead><tbody>" +
         rows + "</tbody></table>";
}

function chartsHtml(files){
  var figs = Object.keys(files || {}).filter(function(k){
    return k.toLowerCase().indexOf(".png") > 0;
  }).map(function(k){
    return '<figure><img src="data:image/png;base64,' + files[k] +
           '" alt="' + esc(k) + '"><figcaption>' + esc(k) + "</figcaption></figure>";
  }).join("");
  return figs ? ('<div class="card"><div class="muted" style="margin-bottom:8px">' +
                 '图表预览</div><div class="charts">' + figs + "</div></div>") : "";
}

function downloadHtml(files){
  var out = "";
  Object.keys(files || {}).forEach(function(k){
    if(k.toLowerCase().indexOf(".docx") > 0 && typeof files[k] === "string"){
      out = '<div class="card"><a href="data:application/vnd.openxmlformats-' +
            'officedocument.wordprocessingml.document;base64,' + files[k] +
            '" download="' + esc(k) + '"><button type="button">下载经营周报' +
            '（docx）</button></a></div>';
    }
  });
  return out;
}

function render(data, message){
  var box = $("result");
  if(!data || data.ok === false){
    box.innerHTML = '<div class="card"><div class="msg err">调用失败：' +
      esc(data && data.error ? data.error : "未知错误") + "</div></div>";
    return;
  }
  var stage = data.stage || "-";
  var recs = data.qa_records || [];
  var passed = recs.filter(function(r){ return r.passed; }).length;
  var msg = message ? ('<div class="msg err">' + esc(message) + "</div>") : "";
  var pause = data.pause_reason ?
    ('<div class="msg err">' + esc(data.pause_reason) + "</div>") : "";

  var html = msg;
  html += '<div class="card"><span class="badge">' + esc(stage) + "</span>";
  html += '<div class="muted" style="margin-top:8px">任务 ' +
          esc(data.task_id) + " · 模型调用 " + esc(data.llm_rounds) +
          " 次 · 会话 " + esc(CID) + "</div>";
  html += pause + "</div>";

  html += '<div class="card"><div style="font-size:16px;font-weight:700;margin-bottom:8px">' +
          "自动质检（" + recs.length + " 项，通过 " + passed + " 项）" +
          "</div>" + qaTable(recs) + "</div>";

  html += chartsHtml(data.files);
  html += downloadHtml(data.files);

  // 审核区：按状态机 stage 决定，网页不自行判断
  if (stage === "HUMAN_REVIEW") {
    html += '<div class="card"><div style="font-size:16px;font-weight:700;'
         +  'margin-bottom:8px">人工审核</div>'
         +  '<label>审核意见（退回时必填，将作为采纳意见写入重做提示词）</label>'
         +  '<textarea id="cmt" placeholder="例如：补充促销活动的量化影响"></textarea>'
         +  '<div><button type="button" onclick="doReview(\'approve\')">通过并交付</button>'
         +  '<button type="button" class="danger" onclick="doReview(\'reject\')">退回重做</button></div></div>';
  } else if (stage === "PAUSED_MISSING") {
    html += '<div class="card"><div style="font-size:16px;font-weight:700;'
         +  'margin-bottom:8px">补充缺失材料</div>'
         +  '<label>材料类型</label>'
         +  '<select id="mkey"><option value="sales_file">门店销售明细</option>'
         +  '<option value="notes_file">周会纪要</option></select>'
         +  '<label>选择文件</label><input type="file" id="mfile">'
         +  '<button type="button" onclick="doMaterial()">补充并继续</button></div>';
  }

  html += '<div class="card"><div class="muted">事件流（最近记录）</div><pre>'
       +  esc((data.events_tail || []).join("\n") || "(无)") + "</pre></div>";

  box.innerHTML = html;
  window.__TASK__ = data.task_id;
}

function toB64(file){
  return new Promise(function(resolve){
    var r = new FileReader();
    r.onload = function(){ resolve(String(r.result).split("base64,")[1] || ""); };
    r.onerror = function(){ resolve(""); };
    r.readAsDataURL(file);
  });
}

async function doRun(){
  var btn = $("btn");
  btn.disabled = true; btn.textContent = "执行中…";
  try{
    var period = document.querySelector('[name=period]').value.trim();
    var submitter = document.querySelector('[name=submitter]').value.trim();
    var tid = $("tid").value.trim() || ("zb_" + Date.now().toString(36));
    var payload = {action:"submit", task_id:tid, period:period,
                   submitter:submitter, with_files:true};
    var sf = $("sf").files[0], nf = $("nf").files[0];
    if (sf){ payload.sales_name = sf.name; payload.sales_file = await toB64(sf); }
    if (nf){ payload.notes_name = nf.name; payload.notes_file = await toB64(nf); }
    var data = await callApi(payload);
    render(data, "");
  }catch(e){
    $("result").innerHTML = '<div class="card"><div class="msg err">'
      + esc(String(e)) + "</div></div>";
  }finally{
    btn.disabled = false; btn.textContent = "发起工单";
  }
}

async function doReview(action){
  var cmt = ($("cmt").value || "").trim();
  if (action === "reject" && !cmt){
    alert("退回必须填写审核意见"); return;
  }
  var tid = window.__TASK__;
  var data = await callApi({action:"review", task_id:tid,
                            decision:action, comment:cmt, with_files:true});
  render(data, "");
}

async function doMaterial(){
  var key = $("mkey").value;
  var f = $("mfile").files[0];
  if (!f){ alert("请选择要补充的文件"); return; }
  var tid = window.__TASK__;
  var data = await callApi({action:"add_material", task_id:tid, key:key,
                            name:f.name, content:await toB64(f), with_files:true});
  render(data, "");
}

document.getElementById("f").addEventListener("submit", function(ev){
  ev.preventDefault(); doRun();
});
</script>
</body>
</html>
